# =============================================================================
# logrotate.conf — Konfigurasi rotasi log
# Total alokasi log: 30GB (dibagi per service)
# =============================================================================

# Nginx logs — 500MB max, 5 file
/opt/myserver/logs/nginx/*.log {
    daily
    rotate 5
    maxsize 100M
    compress
    delaycompress
    missingok
    notifempty
    sharedscripts
    postrotate
        # Signal nginx untuk reload log
        podman exec nginx-proxy nginx -s reopen 2>/dev/null || true
    endscript
}

# AI Router logs — 2GB total (banyak request/response)
/opt/myserver/logs/ai-router/*.log {
    daily
    rotate 10
    maxsize 200M
    compress
    delaycompress
    missingok
    notifempty
}

# Qwen Local logs — 500MB
/opt/myserver/logs/qwen/*.log {
    weekly
    rotate 3
    maxsize 150M
    compress
    delaycompress
    missingok
    notifempty
}

# Storage Manager logs — 200MB
/opt/myserver/logs/storage/*.log {
    weekly
    rotate 3
    maxsize 60M
    compress
    delaycompress
    missingok
    notifempty
}

# Monitoring logs — 500MB
/opt/myserver/logs/monitor/*.log {
    daily
    rotate 5
    maxsize 100M
    compress
    delaycompress
    missingok
    notifempty
}

# System logs — 1GB
/opt/myserver/logs/system/*.log {
    weekly
    rotate 4
    maxsize 250M
    compress
    delaycompress
    missingok
    notifempty
}

# Boot logs — 100MB
/opt/myserver/logs/system/boot.log {
    monthly
    rotate 2
    maxsize 50M
    compress
    missingok
}
