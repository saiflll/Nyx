# =============================================================================
# nginx.conf — Reverse Proxy untuk semua service
# =============================================================================

events {
    worker_processes 1;
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log minimal untuk hemat storage
    access_log /var/log/nginx/access.log combined buffer=16k flush=5m;
    error_log  /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Limit request size (untuk upload)
    client_max_body_size 100m;

    # Upstream services
    upstream web_interface {
        server web-interface:3000;
    }
    upstream ai_router {
        server ai-router:8080;
    }
    upstream storage_manager {
        server storage-manager:8090;
    }
    upstream monitoring {
        server monitoring:8099;
    }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";

        # ─────────────────────────────────────────────────────────────
        # Web Interface (SvelteKit — root)
        # ─────────────────────────────────────────────────────────────
        location / {
            proxy_pass http://web_interface;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (untuk HMR Svelte dev)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ─────────────────────────────────────────────────────────────
        # AI Router
        # ─────────────────────────────────────────────────────────────
        location /api/ai/ {
            # Strip prefix /api/ai
            rewrite ^/api/ai/(.*)$ /$1 break;
            proxy_pass http://ai_router;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Timeout lebih panjang untuk AI (bisa lama)
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # ─────────────────────────────────────────────────────────────
        # Storage Manager
        # ─────────────────────────────────────────────────────────────
        location /api/storage/ {
            rewrite ^/api/storage/(.*)$ /$1 break;
            proxy_pass http://storage_manager;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Timeout lebih panjang untuk operasi storage
            proxy_read_timeout 60s;
        }

        # ─────────────────────────────────────────────────────────────
        # Monitoring
        # ─────────────────────────────────────────────────────────────
        location /api/monitor/ {
            rewrite ^/api/monitor/(.*)$ /$1 break;
            proxy_pass http://monitoring;
            proxy_set_header Host $host;

            # SSE support untuk real-time metrics
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Cache-Control no-cache;
        }

        # ─────────────────────────────────────────────────────────────
        # Health check endpoint
        # ─────────────────────────────────────────────────────────────
        location /health {
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }
    }
}
