<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Mockup</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .chart-mockup {
            width: 100%;
            height: 120px;
            background: linear-gradient(180deg, rgba(6, 182, 212, 0.2) 0%, transparent 100%);
            border-bottom: 2px solid var(--accent-cyan);
            border-radius: 8px 8px 0 0;
            margin-top: 1rem;
            position: relative;
        }
        .chart-mockup::after {
            content: '';
            position: absolute;
            bottom: 0; left: 50%;
            width: 8px; height: 8px;
            background: #fff; border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-cyan);
        }
    </style>
</head>
<body>
    <div class="mockup-container">
        <div class="window-header">
            <div class="mac-dot red"></div>
            <div class="mac-dot yellow"></div>
            <div class="mac-dot green"></div>
            <span class="window-title">SYSTEM MONITORING</span>
        </div>
        <div class="content-area">
            <div class="header-section">
                <h1>Metrik Note 10S</h1>
                <p>Real-time Telemetry & CPU Isolation</p>
            </div>
            
            <div class="card-grid">
                <div class="glass-card">
                    <h3>CPU (Core 4-7)</h3>
                    <p style="font-size:2rem; font-weight:700; color:var(--accent-cyan)">85%</p>
                    <p style="font-size:0.8rem; color:var(--text-secondary)">AI Inference Active • 45°C</p>
                    <div class="chart-mockup"></div>
                </div>
                <div class="glass-card">
                    <h3>RAM Usage</h3>
                    <p style="font-size:2rem; font-weight:700; color:var(--accent-purple)">5.2 GB</p>
                    <p style="font-size:0.8rem; color:var(--text-secondary)">Sisa 2.8 GB (Aman)</p>
                    <div class="chart-mockup" style="background: linear-gradient(180deg, rgba(139, 92, 246, 0.2) 0%, transparent 100%); border-color: var(--accent-purple);"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
